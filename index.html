<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="تطبيق مجوهرات بابل - الفخامة العريقة. أسعار الذهب لحظة بلحظة وكاتالوج مميز." />

  <!-- Favicon using the Logo -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/25Knz1yL/babl3.png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/25Knz1yL/babl3.png" />
  <link rel="manifest" href="/manifest.json" />

  <title>مجوهرات بابل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@200;300;400;500;700;800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#FBF9F1',
              100: '#F5F0DC', // Pearl
              200: '#EAD8A0', // Pale Gold
              300: '#DFC06B', // Light Gold
              400: '#D4AF37', // Metallic Gold (Standard)
              500: '#B4942B', // Rich Gold
              600: '#8C701D', // Dark Gold
              700: '#695313',
              800: '#48380C',
              900: '#2A2005',
              accent: '#F9D058',
            },
            babil: {
              black: '#020202',
              dark: '#080808',
              card: '#0D0D0D',
              glass: 'rgba(13, 13, 13, 0.7)'
            }
          },
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
            serif: ['Amiri', 'serif'],
          },
          boxShadow: {
            'luxury': '0 25px 50px -12px rgba(0, 0, 0, 0.9)',
            'glow': '0 0 40px rgba(212, 175, 55, 0.1)',
            'glow-strong': '0 0 20px rgba(212, 175, 55, 0.3)',
            'inner-light': 'inset 0 1px 0 0 rgba(255, 255, 255, 0.08)',
            'inner-gold': 'inset 0 0 20px rgba(212, 175, 55, 0.05)',
          },
          transitionTimingFunction: {
            'out-expo': 'cubic-bezier(0.19, 1, 0.22, 1)',
            'out-back': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            'smooth': 'cubic-bezier(0.4, 0, 0.2, 1)',
            'slow': 'cubic-bezier(0.2, 0.8, 0.2, 1)',
          },
          animation: {
            'shimmer': 'shimmer 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-up': 'scaleUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            scaleUp: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020202;
      color: #e5e5e5;
      -webkit-font-smoothing: antialiased;
    }

    /* Noise Texture for Luxury Feel */
    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    ::-webkit-scrollbar {
      width: 2px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .gold-text-gradient {
      background: linear-gradient(to bottom, #F5F0DC, #D4AF37, #8C701D);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
